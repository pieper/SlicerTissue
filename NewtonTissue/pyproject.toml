[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newton-tissue"
version = "0.1.0"
description = "High-level FEM API for soft tissue simulation using Newton and Warp"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Steve Pieper", email = "pieper@isomics.com" }]
dependencies = [
    "numpy>=1.24",
    "warp-lang @ git+https://github.com/NVIDIA/warp.git",
    "newton @ git+https://github.com/newton-physics/newton.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/newton_tissue"]
